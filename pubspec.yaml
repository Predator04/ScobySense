name: kombu_app
description: Standalone client for The Fermenstation (SCOBYSENSE) kombucha brewer.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  amazon_cognito_identity_dart_2: ^3.6.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  intl: ^0.19.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes.json
